name: Correction ponctuelle Le Polymath
on:
  push:
    paths:
      - '.github/workflows/render-correction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r series/requirements.txt
      - name: Recalculer le raccord psychologie
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python series/make_video.py psychologie
      - uses: actions/upload-artifact@v7
        with:
          name: polymath-psychologie
          path: series/out/psychologie/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
